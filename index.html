<!DOCTYPE html>

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fdf2f8;
            background-image: radial-gradient(#f472b6 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .neo-box {
            border: 3px solid #1e293b;
            box-shadow: 4px 4px 0px 0px #1e293b;
            border-radius: 12px;
        }

        .neo-box-sm {
            border: 2px solid #1e293b;
            box-shadow: 2px 2px 0px 0px #1e293b;
            border-radius: 8px;
        }

        .neo-button {
            border: 3px solid #1e293b;
            border-radius: 12px 12px 0 0;
            transition: all 0.2s;
            cursor: pointer;
        }

        .neo-button.active {
            background-color: #fde047;
            transform: translateY(-2px);
            box-shadow: 4px 4px 0px 0px #1e293b;
            z-index: 10;
        }

        .neo-button.inactive {
            background-color: #f8fafc;
            border-bottom: 0;
            box-shadow: none;
            opacity: 0.7;
        }
        
        .neo-button.inactive:hover {
            background-color: #e2e8f0;
            opacity: 1;
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.7rem center;
            background-size: 1em;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
        }
        
        th, td {
            border-bottom: 2px solid #1e293b;
            border-right: 2px solid #1e293b;
        }
        
        th:last-child, td:last-child {
            border-right: none;
        }
        
        tr:last-child td {
            border-bottom: none;
        }

        /* Checkbox styling */
        .custom-checkbox {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid #1e293b;
            border-radius: 4px;
            background-color: #fff;
            cursor: pointer;
            position: relative;
            display: inline-block;
            vertical-align: middle;
        }

        .custom-checkbox:checked {
            background-color: #f472b6;
        }

        .custom-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 7px;
            top: 3px;
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        
        .modal-content {
            background: #fff;
            padding: 2rem;
            max-width: 90%;
            width: 400px;
        }

        .input-correct {
            background-color: #4ade80 !important;
            color: #1e293b;
            border-color: #166534;
        }

        .input-wrong {
            background-color: #fca5a5 !important;
            color: #7f1d1d;
            border-color: #991b1b;
        }

        .btn-confirm {
            background-color: #3b82f6;
            color: white;
        }
        
        .btn-confirm:hover:not(:disabled) {
            background-color: #2563eb;
            transform: scale(1.05);
        }
        
        .btn-confirm:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

            if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);

            });
        };

        function init() {
            // Parse raw data, assign standard ID
            words = rawData.map(entry => {
                const [word, pos, lesson, chinese] = entry.split('|');
                const id = JSON.stringify([lesson, pos, word]);
                return { id, word, pos, lesson, chinese };
            });

            bindUIEvents();
            setupActivityTracking();
            
            // Check auth status
            document.getElementById('registration-modal').classList.remove('hidden');

        function bindUIEvents() {
            // Registration Events
            document.getElementById('btn-register').addEventListener('click', handleRegistration);
            document.getElementById('btn-resume').addEventListener('click', () => finalizeLogin(false));
            document.getElementById('btn-new-round').addEventListener('click', () => finalizeLogin(true));
            
            // App Events
            document.getElementById('btn-manual-save').addEventListener('click', forceSync);
            document.getElementById('btn-end-session').addEventListener('click', endSession);
            document.getElementById('btn-change-student').addEventListener('click', changeStudent);
            
            // Filter Events
            document.getElementById('filter-lesson').addEventListener('change', updateView);
            document.getElementById('filter-letter').addEventListener('change', updateView);
            document.getElementById('filter-pos').addEventListener('change', updateView);
            
            document.getElementById('btn-toggle-starred').addEventListener('click', () => {
                filterModes.starredOnly = !filterModes.starredOnly;
                updateView();
            });
            document.getElementById('btn-toggle-mistakes').addEventListener('click', () => {
                filterModes.mistakesOnly = !filterModes.mistakesOnly;
                updateView();
            });
            document.getElementById('btn-reset-filters').addEventListener('click', resetAllFilters);

            document.getElementById('tab-challenge').addEventListener('click', () => switchTab('challenge'));

            // Challenge Tools Events

            document.getElementById('btn-clear-inputs').addEventListener('click', clearAllDrafts);

            // Delegation for dynamic table buttons
            document.getElementById('list-tbody').addEventListener('click', handleTableClicks);
            document.getElementById('challenge-tbody').addEventListener('click', handleTableClicks);
            
            // Delegation for dynamic table inputs (Enter key)
            document.getElementById('challenge-tbody').addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' && e.target.type === 'text' && e.key === 'Enter') {
                    const tr = e.target.closest('tr');
                    const btn = tr.querySelector('.btn-confirm');
                    if(btn && !btn.disabled) btn.click();
                }
            });
            
            // Real-time drafting tracking
            document.getElementById('challenge-tbody').addEventListener('input', (e) => {
                if (e.target.tagName === 'INPUT' && e.target.type === 'text') {
                    const id = e.target.closest('tr').dataset.id;
                    initItemState(id);
                    state.items[id].draft = e.target.value;
                    e.target.classList.remove('input-correct', 'input-wrong'); // Reset colors when typing
                }
            });
        }

        function handleRegistration() {
            const classVal = document.getElementById('reg-class').value.trim();
            const seatVal = document.getElementById('reg-seat').value.trim();
            const nameVal = document.getElementById('reg-name').value.trim();
            const errorEl = document.getElementById('reg-error');

            if (!classVal || !seatVal || !nameVal || seatVal < 1 || seatVal > 50) {
                errorEl.classList.remove('hidden');
                return;
            }
            errorEl.classList.add('hidden');

            const newStudent = { className: classVal, seatNumber: parseInt(seatVal, 10), name: nameVal };
            pendingStorageKey = `b1_student_${newStudent.className}_${newStudent.seatNumber}`;
            
            const existingDataStr = localStorage.getItem(pendingStorageKey);
            
            if (existingDataStr) {
                try {
                    const parsed = JSON.parse(existingDataStr);
                    // Confirm name match? (Simple verification for same seat mapping)
                    if(parsed.student && parsed.student.name !== newStudent.name) {
                       if(!confirm(`此座號已有紀錄姓名：${parsed.student.name}。是否覆蓋並換人？\n(取消則請重新輸入座號)`)) return;
                    }
                    
                    // Found valid data, show resume options
                    state.student = newStudent; 
                    document.getElementById('resume-actions').classList.remove('hidden');
                    document.getElementById('btn-register').classList.add('hidden');
                } catch(e) {
                    // Invalid JSON, overwrite
                    state.student = newStudent;
                    finalizeLogin(true); 
                }
            } else {
                state.student = newStudent;
                finalizeLogin(true);
            }
        }

        function finalizeLogin(isNewRound) {
            document.getElementById('registration-modal').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('display-student-info').textContent = `${state.student.className}-${state.student.seatNumber} ${state.student.name}`;
            
            if (isNewRound) {
                startNewSession();
            } else {
                loadSession();
            }
            
            // Start sync loop
            if(saveInterval) clearInterval(saveInterval);
            saveInterval = setInterval(checkAndSync, 30000);
            
            updateView();
        }

        function startNewSession() {
            let oldStarred = {};
            // Preserve starred items if data exists
            try {
                const oldData = JSON.parse(localStorage.getItem(pendingStorageKey));
                if (oldData && oldData.items) {
                    for (const id in oldData.items) {
                        if (oldData.items[id].starred) oldStarred[id] = true;
                    }
                }
            } catch(e) {}

            state = {
                sessionId: uuidv4(),
                revision: 1,
                student: state.student,
                startedAt: new Date().toISOString(),
                activeSeconds: 0,
                status: "進行中",
                items: {}
            };

            // Restore stars
            for (const id in oldStarred) {
                initItemState(id);
                state.items[id].starred = true;
            }

            lastSyncedRevision = 0;
            saveLocally();
        }

        function loadSession() {
            try {
                const data = JSON.parse(localStorage.getItem(pendingStorageKey));
                if (data && data.sessionId) {
                    state = data;
                    lastSyncedRevision = data.revision - 1; // Assume need sync if any change happened offline
                } else {
                    startNewSession();
                }
            } catch(e) {
                alert("本機資料解析失敗，將開啟新進度。");
                startNewSession();
            }
        }

        function saveLocally() {
            try {
                localStorage.setItem(pendingStorageKey, JSON.stringify(state));
            } catch(e) {
                console.error("Local Storage Save Error:", e);
                alert("儲存空間不足或存取遭拒，無法保存在本機。");
            }
        }

        async function changeStudent() {
            if (state.revision > lastSyncedRevision) {
                const ok = confirm("有未上傳的進度。點擊確定將強制儲存後登出，若網路不穩可能遺失該段資料。");
                if(!ok) return;
                await forceSync(true); // wait for sync
            }
            
            if(saveInterval) clearInterval(saveInterval);
            
            state = { sessionId: null, revision: 0, student: null, startedAt: null, activeSeconds: 0, status: "進行中", items: {} };
            pendingStorageKey = null;
            
            document.getElementById('app-container').classList.add('hidden');
            
            // Reset modal
            document.getElementById('registration-modal').classList.remove('hidden');
            document.getElementById('btn-register').classList.remove('hidden');
            document.getElementById('resume-actions').classList.add('hidden');
            document.getElementById('reg-class').value = '';
            document.getElementById('reg-seat').value = '';
            document.getElementById('reg-name').value = '';
        }

        async function endSession() {
            state.status = "已結束";
            state.revision++;
            saveLocally();
            await forceSync(true);
            alert("進度已儲存。您可以關閉視窗。");
        }

        function setupActivityTracking() {
            const updateActivity = () => { lastActivityTime = Date.now(); };
            ['mousemove', 'keydown', 'touchstart', 'scroll'].forEach(evt => {
                document.addEventListener(evt, updateActivity, { passive: true });
            });

            activityInterval = setInterval(() => {
                if (document.visibilityState === 'visible' && state.sessionId && state.status === "進行中") {
                    if (Date.now() - lastActivityTime < 60000) {
                        state.activeSeconds++;
                    }
                }
            }, 1000);
        }

        async function checkAndSync() {
            if (isSyncing || state.revision <= lastSyncedRevision || !state.sessionId) return;
            await executeSync();
        }

        async function forceSync(wait = false) {
            if (!state.sessionId) return;
            if (state.revision === lastSyncedRevision) {
                alert("目前無新進度需儲存。");
                return;
            }
            if (wait) {
                await executeSync();
            } else {
                executeSync();
            }
        }

        function executeSync() {
            return new Promise(async (resolve) => {
                isSyncing = true;
                const statusEl = document.getElementById('sync-status');
                statusEl.textContent = "儲存中...";
                statusEl.className = "text-blue-500";

                const currentRevision = state.revision;
                
                // Build payload matching exact required schema
                const payload = {
                    sessionId: state.sessionId,
                    revision: currentRevision,
                    student: state.student,
                    startedAt: state.startedAt,
                    scope: document.getElementById('filter-lesson').value,
                    totalWords: words.length,
                    activeSeconds: state.activeSeconds,
                    status: state.status,
                    items: []
                };

                // Add interacted items
                for (const id in state.items) {
                    const item = state.items[id];
                    // Find basic info from words array
                    const wordInfo = words.find(w => w.id === id);
                    if (wordInfo) {
                        payload.items.push({
                            questionId: id,
                            lesson: wordInfo.lesson,
                            pos: wordInfo.pos,
                            word: wordInfo.word,
                            attempts: item.attempts,
                            firstCorrect: item.firstCorrect,
                            correct: item.correct,
                            hintUsed: item.hintUsed,
                            audioCount: item.audioCount,
                            starred: item.starred,
                            lastAnswer: item.lastAnswer
                        });
                    }
                }

                // ==========================================
                //  設定您的 Google Apps Script Web App 網址
                // ==========================================
                const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz3b1GomuMuyCCpX0vZk6Hm7s8-D0IqPp4lLemg860XwHA2ma3f3qERb-m5FMNeubWZyg/exec"; 

                // 檢查是否已填入網址，若無則停留在預覽模式
                if (!GAS_API_URL.startsWith("https://script.google.com/")) {
                    setTimeout(() => {
                        lastSyncedRevision = currentRevision;
                        statusEl.textContent = "預覽模式：只存本機";
                        statusEl.className = "text-orange-500";
                        isSyncing = false;
                        resolve();
                    }, 500);
                    return;
                }

                try {
                    // 使用 fetch 發送資料
                    // 使用 text/plain 藉此避開瀏覽器對於 application/json 嚴格的預檢請求 (Preflight CORS)
                    const response = await fetch(GAS_API_URL, {
                        method: "POST",
                        headers: {
                            "Content-Type": "text/plain;charset=utf-8" 
                        },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    
                    isSyncing = false;
                    if (result && result.ok === true) {
                        lastSyncedRevision = currentRevision;
                        if (state.revision > lastSyncedRevision) {
                            statusEl.textContent = "有新進度待儲存";
                            statusEl.className = "text-orange-500";
                        } else {
                            statusEl.textContent = state.status === "已結束" ? "已結束並儲存" : "已儲存";
                            statusEl.className = "text-green-600";
                        }
                    } else {
                        throw new Error(result.error || "Unknown Error");
                    }
                } catch (error) {
                    isSyncing = false;
                    console.error("Sync Error:", error);
                    statusEl.textContent = "儲存失敗，資料保留於本機，請重試";
                    statusEl.className = "text-red-600 font-bold";
                }
                
                resolve();
            });
        }

        function markStateChanged() {
            state.revision++;
            saveLocally();
            const statusEl = document.getElementById('sync-status');
            if (statusEl.textContent !== "儲存中...") {
                 if (typeof google === 'undefined' || typeof google.script === 'undefined') {
                     statusEl.textContent = "預覽模式：有未傳送的變更";
                     statusEl.className = "text-orange-500";
                 } else {
                     statusEl.textContent = "有新進度待儲存";
                     statusEl.className = "text-orange-500";
                 }
            }
        }

        function initItemState(id) {
            if (!state.items[id]) {
                state.items[id] = {
                    draft: "",
                    attempts: 0,
                    firstCorrect: null, // null until first submit
                    correct: false,
                    hintUsed: false,
                    audioCount: 0,
                    starred: false,
                    lastAnswer: ""
                };
            }
        }

        // Check if lesson is in range
        function isLessonInRange(lesson, range) {
            const ranges = {
                'EXAM1': ['L1', 'L2', 'L3', 'R1'],
                'EXAM2': ['L4', 'L5', 'L6', 'R2'],
                'EXAM3': ['L7', 'L8', 'L9', 'R3']
            };
            return ranges[range] ? ranges[range].includes(lesson) : false;
        }

        function speak(text, id) {
            initItemState(id);
            state.items[id].audioCount++;
            markStateChanged();

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            } else {
                console.warn("您的瀏覽器不支援語音發音功能。");
            }
        }

        function toggleStar(id) {
            initItemState(id);
            state.items[id].starred = !state.items[id].starred;
            markStateChanged();
            updateView();
        }

        function handleHintToggle(id, isChecked) {
            initItemState(id);
            if (isChecked && !state.items[id].hintUsed) {
                state.items[id].hintUsed = true;
                markStateChanged();
            }
            // Even if unchecked, hintUsed remains true historically.
            // But we control rendering of the hint string via the checkbox state in DOM.
            const hintSpan = document.getElementById(`hint-${id}`);
            if(hintSpan) {
                if(isChecked) {
                    const wordObj = words.find(w => w.id === id);
                    hintSpan.innerHTML = generateHintString(wordObj.word);
                } else {
                    hintSpan.innerHTML = '';
                }
            }
        }

        function submitAnswer(id, inputValue) {
            initItemState(id);
            const sItem = state.items[id];
            
            // Do nothing if already correctly submitted
            if(sItem.correct) return;

            const val = cleanString(inputValue);
            if (val === "") return; // Skip empty submissions

            const wordObj = words.find(w => w.id === id);
            const target = cleanString(wordObj.word);

            const isCorrectNow = (val === target);
            
            sItem.attempts++;
            sItem.lastAnswer = inputValue;
            
            if (sItem.firstCorrect === null) {
                sItem.firstCorrect = isCorrectNow;
            }
            
            sItem.correct = isCorrectNow;
            // Clear draft on submission
            sItem.draft = ""; 
            
            markStateChanged();
            updateView(); // Re-render to show updated colors/locks and progress
        }

        function updateView() {
            if(!state.student) return;

            const lessonFilter = document.getElementById('filter-lesson').value;
            const letterFilter = document.getElementById('filter-letter').value;
            const posFilter = document.getElementById('filter-pos').value;

            filteredWords = words.filter(item => {
                let passLesson = (lessonFilter === 'ALL') || 
                                 (lessonFilter.startsWith('EXAM') ? isLessonInRange(item.lesson, lessonFilter) : item.lesson === lessonFilter);
                
                let passLetter = (letterFilter === 'ALL') || item.word.toUpperCase().startsWith(letterFilter);
                
                let passPos = (posFilter === 'ALL') || item.pos.includes(posFilter);

                let passStarred = true;
                if (filterModes.starredOnly) {
                    passStarred = state.items[item.id] && state.items[item.id].starred;
                }

                let passMistake = true;
                if (filterModes.mistakesOnly) {
                    // Include if they answered at least once AND first correct is false
                    passMistake = state.items[item.id] && state.items[item.id].firstCorrect === false;
                }

                return passLesson && passLetter && passPos && passStarred && passMistake;
            });

            // Update Counters & UI styling
            document.getElementById('word-count').textContent = filteredWords.length;
            
            // Calculate stars and mistakes for whole data to show in buttons
            let totalStars = 0;
            let totalMistakes = 0;
            let totalGlobalCorrect = 0;
            
            for(const w of words) {
                if(state.items[w.id]) {
                    if(state.items[w.id].starred) totalStars++;
                    if(state.items[w.id].firstCorrect === false) totalMistakes++;
                    if(state.items[w.id].correct) totalGlobalCorrect++;
                }
            }
            
            document.getElementById('starred-count').textContent = totalStars;
            document.getElementById('mistake-count').textContent = totalMistakes;
            
            // Global Progress Update
            const gText = document.getElementById('global-progress-text');
            const gFill = document.getElementById('global-progress-fill');
            const gPercent = words.length ? Math.round((totalGlobalCorrect / words.length) * 100) : 0;
            gText.textContent = `${totalGlobalCorrect} / ${words.length} (${gPercent}%)`;
            gFill.style.width = `${gPercent}%`;

            const btnStar = document.getElementById('btn-toggle-starred');
            btnStar.className = filterModes.starredOnly 
                ? "bg-[#c2410c] text-white font-bold py-2 px-3 neo-box-sm flex items-center gap-1 ring-4 ring-orange-300"
                : "bg-[#fb923c] text-white font-bold py-2 px-3 neo-box-sm flex items-center gap-1 transition-transform hover:scale-105";
                
            const btnMistake = document.getElementById('btn-toggle-mistakes');
            btnMistake.className = filterModes.mistakesOnly
                ? "bg-[#b91c1c] text-white font-bold py-2 px-3 neo-box-sm flex items-center gap-1 ring-4 ring-red-300"
                : "bg-[#ef4444] text-white font-bold py-2 px-3 neo-box-sm flex items-center gap-1 transition-transform hover:scale-105";

            // Render current active tab
            if (currentTab === 'list') {
                renderList();
            } else {
                renderChallenge();
            }
        }

        function switchTab(tabId) {
            currentTab = tabId;
            
            const btnList = document.getElementById('tab-list');
            const btnChallenge = document.getElementById('tab-challenge');
            const viewList = document.getElementById('view-list');
            const viewChallenge = document.getElementById('view-challenge');

            if (tabId === 'list') {
                btnList.className = "neo-button active flex-1 py-3 text-base md:text-lg font-bold flex items-center justify-center gap-2 border-r-0 sm:border-r-3";
                btnChallenge.className = "neo-button inactive flex-1 py-3 text-base md:text-lg font-bold flex items-center justify-center gap-2 border-l-0 sm:border-l-3";
                viewList.classList.remove('hidden');
                viewChallenge.classList.add('hidden');
            } else {
                btnChallenge.className = "neo-button active flex-1 py-3 text-base md:text-lg font-bold flex items-center justify-center gap-2 border-l-0 sm:border-l-3";
                btnList.className = "neo-button inactive flex-1 py-3 text-base md:text-lg font-bold flex items-center justify-center gap-2 border-r-0 sm:border-r-3";
                viewChallenge.classList.remove('hidden');
                viewList.classList.add('hidden');
            }

            updateView(); 
        }

        function renderList() {
            const tbody = document.getElementById('list-tbody');
            tbody.innerHTML = '';

            if (filteredWords.length === 0) {
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 4;
                td.className = "p-8 text-center text-gray-500 font-bold";
                td.textContent = "沒有符合條件的單字 😢";
                tr.appendChild(td);
                tbody.appendChild(tr);
                return;
            }

            filteredWords.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? "bg-white" : "bg-slate-50";
                tr.dataset.id = item.id;
                
                const badgeColor = item.lesson.startsWith('R') ? 'bg-[#f472b6]' : 'bg-[#1e293b] text-white';
                const isMistake = state.items[item.id] && state.items[item.id].firstCorrect === false;
                const isStarred = state.items[item.id] && state.items[item.id].starred;
                const starIcon = isStarred ? '⭐' : '☆';

                // We construct safe DOM nodes
                const tdWord = document.createElement('td');
                tdWord.className = "p-3 md:p-4 text-base md:text-lg text-[#1d4ed8] font-bold";
                tdWord.textContent = item.word;
                if(isMistake) {
                    const mk = document.createElement('span');
                    mk.className = "ml-2 text-xs bg-red-100 text-red-600 px-1 rounded border border-red-300";
                    mk.textContent = "曾錯";
                    tdWord.appendChild(mk);
                }

                const tdMeaning = document.createElement('td');
                tdMeaning.className = "p-3 md:p-4";
                tdMeaning.textContent = `(${item.pos}) ${item.chinese}`;

                const tdLesson = document.createElement('td');
                tdLesson.className = "p-3 md:p-4 text-center";
                tdLesson.innerHTML = `<span class="inline-block px-3 py-1 rounded-full text-sm font-black ${badgeColor} border-2 border-black">${item.lesson}</span>`;

                const tdActions = document.createElement('td');
                tdActions.className = "p-3 md:p-4 text-center space-x-2";
                
                const btnAudio = document.createElement('button');
                btnAudio.className = "hover:scale-125 transition-transform text-2xl";
                btnAudio.title = "發音";
                btnAudio.dataset.action = "play-audio";
                btnAudio.textContent = "🔊";
                
                const btnStar = document.createElement('button');
                btnStar.className = "hover:scale-125 transition-transform text-2xl";
                btnStar.title = "加入/移除收藏";
                btnStar.dataset.action = "toggle-star";
                btnStar.textContent = starIcon;

                tdActions.appendChild(btnAudio);
                tdActions.appendChild(btnStar);

                tr.appendChild(tdWord);
                tr.appendChild(tdMeaning);
                tr.appendChild(tdLesson);
                tr.appendChild(tdActions);
                
                tbody.appendChild(tr);
            });
        }

        function renderChallenge() {
            const tbody = document.getElementById('challenge-tbody');
            tbody.innerHTML = '';

            let scopeCorrectCount = 0;

            if (filteredWords.length === 0) {
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 5;
                td.className = "p-8 text-center text-gray-500 font-bold";
                td.textContent = "沒有符合條件的單字 😢";
                tr.appendChild(td);
                tbody.appendChild(tr);
                updateScopeProgress(0, 0);
                return;
            }

            filteredWords.forEach((item, index) => {
                const sItem = state.items[item.id] || {};
                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? "bg-white" : "bg-slate-50";
                tr.dataset.id = item.id;
                
                if (sItem.correct) scopeCorrectCount++;
                
                const isStarred = sItem.starred;
                const starIcon = isStarred ? '⭐' : '☆';

                // Meaning
                const tdMeaning = document.createElement('td');
                tdMeaning.className = "p-3 md:p-4 font-bold text-gray-700";
                tdMeaning.textContent = `(${item.pos}) ${item.chinese}`;
                
                if(sItem.firstCorrect === false) {
                    const mk = document.createElement('div');
                    mk.className = "mt-1 text-xs text-red-600";
                    mk.textContent = "(曾答錯)";
                    tdMeaning.appendChild(mk);
                }

                // Input Area
                const tdInput = document.createElement('td');
                tdInput.className = "p-3 md:p-4 flex flex-col md:flex-row gap-2";
                
                const inputEl = document.createElement('input');
                inputEl.type = "text";
                inputEl.className = "flex-1 neo-box-sm p-2 outline-none font-bold text-base md:text-lg transition-colors focus:ring-2 focus:ring-black min-w-[120px]";
                inputEl.placeholder = "輸入英文...";
                inputEl.autocomplete = "off";
                inputEl.spellcheck = false;
                
                // Restore state appearance
                if (sItem.correct) {
                    inputEl.value = item.word; // Show exact correct answer
                    inputEl.disabled = true;
                    inputEl.classList.add('input-correct');
                } else {
                    inputEl.value = sItem.draft || ""; 
                    if (sItem.attempts > 0 && sItem.lastAnswer !== "") {
                        // Display previous wrong submission if no new draft
                        if(!sItem.draft) inputEl.value = sItem.lastAnswer;
                        inputEl.classList.add('input-wrong');
                    }
                }

                const btnConfirm = document.createElement('button');
                btnConfirm.className = "btn-confirm font-bold py-2 px-3 neo-box-sm flex-shrink-0";
                btnConfirm.textContent = "確認";
                btnConfirm.dataset.action = "submit-answer";
                if(sItem.correct) btnConfirm.disabled = true;

                tdInput.appendChild(inputEl);
                tdInput.appendChild(btnConfirm);

                // Hint Checkbox
                const tdHint = document.createElement('td');
                tdHint.className = "p-3 md:p-4 text-center";
                const checkEl = document.createElement('input');
                checkEl.type = "checkbox";
                checkEl.className = "custom-checkbox";
                checkEl.dataset.action = "toggle-hint";
                // If previously checked in UI (or we want to restore from hintUsed), handle it here.
                // Normally we don't force it checked unless the user checks it *this* render, 
                // but for simplicity, let's allow them to toggle it to see the string.
                tdHint.appendChild(checkEl);

                // Hint Text Area
                const tdHintText = document.createElement('td');
                tdHintText.className = "p-3 md:p-4 text-center font-bold text-[#ea580c] text-lg md:text-xl tracking-widest";
                const spanHint = document.createElement('span');
                spanHint.id = `hint-${item.id}`;
                // If hintUsed is true, we might auto-show it or wait for checkbox. Wait for checkbox is better UX so it doesn't clutter.
                tdHintText.appendChild(spanHint);

                // Actions
                const tdActions = document.createElement('td');
                tdActions.className = "p-3 md:p-4 text-center space-x-2";
                
                const btnAudio = document.createElement('button');
                btnAudio.className = "hover:scale-125 transition-transform text-2xl";
                btnAudio.title = "發音";
                btnAudio.dataset.action = "play-audio";
                btnAudio.textContent = "🔊";
                
                const btnStar = document.createElement('button');
                btnStar.className = "hover:scale-125 transition-transform text-2xl";
                btnStar.title = "加入/移除收藏";
                btnStar.dataset.action = "toggle-star";
                btnStar.textContent = starIcon;

                tdActions.appendChild(btnAudio);
                tdActions.appendChild(btnStar);

                tr.appendChild(tdMeaning);
                tr.appendChild(tdInput);
                tr.appendChild(tdHint);
                tr.appendChild(tdHintText);
                tr.appendChild(tdActions);
                
                tbody.appendChild(tr);
            });
            
            updateScopeProgress(scopeCorrectCount, filteredWords.length);
        }

        function updateScopeProgress(correctCount, total) {
            const pText = document.getElementById('scope-progress-text');
            const pBar = document.getElementById('scope-progress-fill');
            
            pText.textContent = `${correctCount} / ${total}`;
            if (total === 0) {
                pBar.style.width = '0%';
            } else {
                const percentage = (correctCount / total) * 100;
                pBar.style.width = `${percentage}%`;
            }
        }

        // Table Event Delegation Handler
        function handleTableClicks(e) {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            
            const tr = e.target.closest('tr');
            if(!tr) return;
            const id = tr.dataset.id;
            const action = btn.dataset.action;

            if (action === 'play-audio') {
                const wordObj = words.find(w => w.id === id);
                speak(wordObj.word, id);
            } else if (action === 'toggle-star') {
                toggleStar(id);
            } else if (action === 'submit-answer') {
                const inputEl = tr.querySelector('input[type="text"]');
                if(inputEl) submitAnswer(id, inputEl.value);
            } else if (action === 'toggle-hint') {
                handleHintToggle(id, btn.checked);
            }
        }

        function checkAllHints() {
            const checkboxes = document.querySelectorAll('#challenge-tbody .custom-checkbox');
            checkboxes.forEach(cb => {
                if (!cb.checked) {
                    cb.checked = true;
                    // manually trigger logic since dispatchEvent doesn't bubble custom nicely in delegation sometimes
                    const tr = cb.closest('tr');
                    handleHintToggle(tr.dataset.id, true);
                }
            });
        }

        function clearAllDrafts() {
            // Only clears draft, does not delete official attempts/correct stats
            filteredWords.forEach(item => {
                if(state.items[item.id]) {
                    state.items[item.id].draft = "";
                }
            });
            markStateChanged();
            updateView();
        }

        function resetAllFilters() {
            document.getElementById('filter-lesson').value = 'ALL';
            document.getElementById('filter-letter').value = 'ALL';
            document.getElementById('filter-pos').value = 'ALL';
            filterModes.starredOnly = false;
            filterModes.mistakesOnly = false;
            updateView();
        }

        function generateHintString(word) {
            const wordsArray = word.split(' ');
            return wordsArray.map(w => {
                if (w.length <= 2) {
                    return w.charAt(0) + (w.length > 1 ? " _" : "");
                }
                const first = w.charAt(0);
                const last = w.charAt(w.length - 1);
                const underscores = Array(w.length - 2).fill('_').join(' ');
                return `${first} ${underscores} ${last}`;
            }).join(' &nbsp;&nbsp; '); 
        }

        // Initialize application on load
        window.onload = init;
    </script>
</body>
